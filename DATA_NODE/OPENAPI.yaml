openapi: 3.0.3
info:
  title: DATA_NODE API
  version: 1.0.0
servers:
  - url: http://localhost:8088
paths:
  /health:
    get:
      summary: Service health
      responses:
        "200":
          description: OK
  /sessions:
    post:
      summary: Register or ingest one hbr dataset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionRequest"
      responses:
        "200":
          description: Session registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
    get:
      summary: List sessions
      parameters:
        - in: query
          name: taskName
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            default: 100
      responses:
        "200":
          description: Session list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SessionResponse"
  /sessions/{datasetId}:
    get:
      summary: Get one session metadata
      parameters:
        - in: path
          name: datasetId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Session metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "404":
          description: Not found
  /sessions/{datasetId}/download:
    get:
      summary: Download dataset archive
      parameters:
        - in: path
          name: datasetId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: tar.gz stream
  /lerobot/export:
    post:
      summary: Create merged LeRobot export
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExportRequest"
      responses:
        "200":
          description: Export accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportResponse"
components:
  schemas:
    CreateSessionRequest:
      type: object
      required:
        - datasetId
        - taskName
        - label
        - sourcePath
      properties:
        datasetId:
          type: string
        taskName:
          type: string
        label:
          type: string
        sourcePath:
          type: string
    SessionResponse:
      type: object
      required:
        - datasetId
        - taskName
        - label
        - storageState
      properties:
        datasetId:
          type: string
        taskName:
          type: string
        label:
          type: string
        storageState:
          type: string
          enum: [ingested, missing, error]
        createdUtcIso:
          type: string
    ExportRequest:
      type: object
      required:
        - exportName
        - datasetIds
      properties:
        exportName:
          type: string
        datasetIds:
          type: array
          items:
            type: string
    ExportResponse:
      type: object
      required:
        - exportId
        - status
      properties:
        exportId:
          type: string
        status:
          type: string
