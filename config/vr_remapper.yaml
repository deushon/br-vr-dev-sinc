# Эталонная поза робота (body_link): руки перед собой, слегка внизу.
# При нажатии R_A оператор приводит руки в похожее положение — вычисляется offset.
# Можно подправить для симметрии (сейчас левая/правая чуть разные).
reference_pose:
  left:  [0.143281, 0.103784, 0.020140]   # x, y, z
  right: [0.124819, -0.087679, 0.016086]

# SCALE: чувствительность 0.0001..100, обновляется из UI на лету
scale: 0.25
